<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00796B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="alifGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>
  
  <!-- Stylized Arabic Alif (ا) -->
  <path d="M 256 120 
           C 260 120, 280 125, 285 135
           L 310 200
           C 312 210, 315 240, 315 270
           L 318 340
           C 318 360, 315 380, 310 390
           C 305 395, 290 400, 280 398
           C 270 396, 260 390, 255 385
           C 250 380, 245 370, 243 360
           L 240 340
           C 238 320, 237 280, 237 270
           L 235 200
           C 233 170, 235 145, 240 135
           C 245 125, 252 120, 256 120 Z" 
        fill="url(#alifGradient)" 
        stroke="#FFD700" 
        stroke-width="4"
        opacity="0.95"/>
  
  <!-- Shine effect -->
  <ellipse cx="270" cy="180" rx="8" ry="25" fill="white" opacity="0.3" transform="rotate(-15 270 180)"/>
</svg>
