<!doctype html>
<html lang="id" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahir Arab - Platform Pembelajaran Bahasa Arab</title>
    <!-- Arabic Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Scheherazade+New:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="text/javascript" src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    // Jika user belum login, tendang ke landing page
                    window.location.href = "/";
                } else {
                    // Jika user sudah login, tampilkan konten
                    document.body.style.display = "block";
                }
            });

            // Jika user logout, reload halaman (biar terkunci lagi)
            window.netlifyIdentity.on("logout", () => {
                window.location.href = "/";
            });
        }
    </script>
    <style>
        /* Sembunyikan body sampai status login terkonfirmasi */
        body {
            display: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
